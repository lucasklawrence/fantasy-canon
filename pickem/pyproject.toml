[project]
name = "fantasy-canon-pickem"
version = "0.1.0"
description = "Weekly NFL pick'em briefing: odds, line moves, starter injuries, rest, weather, and a graded history."
readme = "README.md"
requires-python = ">=3.12"

# Standard library only at runtime (urllib, csv, json) so the scheduled workflow needs no installs.
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
