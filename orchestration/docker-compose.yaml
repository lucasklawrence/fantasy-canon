# Local-only Airflow for Fantasy Canon orchestration (issue #13, epic #12).
# Cost: $0 — everything runs on your machine. Nothing here touches GCP.
# Stack: Postgres metadata DB + LocalExecutor + webserver + scheduler.
#
#   docker compose up        # start (UI at http://localhost:8080, login admin/admin)
#   docker compose down      # stop, keep metadata
#   docker compose down -v   # stop and wipe the metadata DB
#
# Keep the airflow image tag in lockstep with apache-airflow in pyproject.toml.

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Fixed dev secret so webserver + scheduler agree. Local only — do not reuse anywhere real.
    AIRFLOW__WEBSERVER__SECRET_KEY: "fantasy-canon-local-dev"
    # Your league / DB knobs flow through to DAGs as env (see .env.example).
    ESPN_LEAGUE_ID: "${ESPN_LEAGUE_ID:-}"
    ESPN_S2: "${ESPN_S2:-}"
    ESPN_SWID: "${ESPN_SWID:-}"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    # 5433 on the host so this never clashes with the app's own Postgres on 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: migrate the metadata DB and create the admin user, then exit.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-db:
