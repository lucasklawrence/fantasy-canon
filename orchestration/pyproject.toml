[project]
name = "fantasy-canon-orchestration"
version = "0.1.0"
description = "Python Airflow sidecar that orchestrates Fantasy Canon's ESPN -> storyline -> Discord pipeline. See issue #12."
readme = "README.md"
requires-python = ">=3.12"

# Airflow itself runs in Docker (see docker-compose.yaml). These deps exist so the
# DAGs type-check / autocomplete locally via `uv sync`, and so future tasks can be
# unit-tested outside a container. Keep the Airflow version in lockstep with the
# image tag in docker-compose.yaml.
dependencies = [
    "apache-airflow==2.10.5",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.pytest.ini_options]
# Only collect the unit tests -- keeps a bare `pytest` from wandering into Airflow's runtime
# `logs/` dir (whose dangling `scheduler/latest` symlink errors collection on Windows).
testpaths = ["tests"]
