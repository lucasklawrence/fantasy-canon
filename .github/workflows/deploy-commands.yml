name: Deploy Discord Commands

# Registers the /canon slash-command tree with Discord (global commands) whenever the
# command definitions change on main, so the live tree never drifts from the repo.
# Requires two repository Actions secrets: DISCORD_TOKEN and DISCORD_APP_ID
# (Settings → Secrets and variables → Actions). Global commands propagate in up to ~1h.
#
# Trigger: a push to main that touches the command sources, or a manual run
# (workflow_dispatch) — e.g. to force a re-register after a Discord-side change.
on:
  push:
    branches: [main]
    paths:
      - 'apps/bot/src/commands/**'
      - 'apps/bot/deploy-commands.ts'
      - 'apps/bot/src/config.ts'
  workflow_dispatch:

# Least privilege: the job only reads the repo and calls the Discord REST API.
permissions:
  contents: read

# Serialize deploys so two quick merges don't race; don't cancel an in-flight
# registration (a PUT mid-flight should finish), just queue the next one.
concurrency:
  group: deploy-commands
  cancel-in-progress: false

jobs:
  deploy:
    name: Register global slash commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs (Dependabot keeps the SHA + version comment current).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Reads the version from package.json's "packageManager" field (pnpm@9.12.0).
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate: ensure the command tree actually compiles/builds before registering it,
      # so a broken definition never reaches Discord.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Deploy slash commands
        run: pnpm -C apps/bot run deploy
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
