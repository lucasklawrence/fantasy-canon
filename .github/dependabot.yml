version: 2

updates:
  # Keep the CI workflow's pinned action SHAs current — without this, the SHA
  # pins in ci.yml silently freeze on stale (possibly vulnerable) versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # pnpm workspace deps. The single root entry covers the whole workspace —
  # Dependabot traverses every member manifest and regenerates the one root
  # lockfile (proven by #38, which bumped dotenv across root + both apps in one
  # PR). Adding /apps/* and /packages/* on top only duplicated that work into
  # redundant per-directory PRs that fail `--frozen-lockfile` on their stale
  # base (#42, #43). Group minor/patch into one PR; majors stay separate.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
